<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Velvet Scroll</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#f6f8f7;--surface:#fff;--fg:#16201c;--muted:#56655f;--line:#d3ddd8;--accent:#2c6a57;--accent-fg:#fff;--ok:#2c6a57;--bad:#a3392b;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#101715;--surface:#172220;--fg:#e4ece9;--muted:#93a59e;--line:#2a3833;--accent:#6dbea2;--accent-fg:#0b1a15;--ok:#6dbea2;--bad:#ef8a7a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;width:300px;min-width:300px;background:var(--bg);color:var(--fg);font:14px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
main{padding:16px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font:400 20px/1.2 "Young Serif",Georgia,serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:10px 14px;font:700 14px "Atkinson Hyperlegible",system-ui,sans-serif;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
#status{margin:0;min-height:1.4em;color:var(--muted)}
#status.ok{color:var(--ok)} #status.bad{color:var(--bad)}
/* phones (Firefox for Android) open the popup as a full page */
@media (hover:none) and (pointer:coarse){ body{width:auto;min-width:0} }
.site{margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <h1>Velvet Scroll</h1>
  <p class="site" id="site"></p>
  <button class="btn primary" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Save this page</button>
  <p id="status" role="status"></p>
  <button class="btn" id="open">Open library</button>
</main>
<script src="store.js"></script>
<script src="popup.js"></script>
</body>
</html>
